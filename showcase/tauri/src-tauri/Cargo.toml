[package]
name = "roamies"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Hydra Desktop: the Hydra Agent and the Hydra interface for macOS"
repository = "https://github.com/EasonJiangOfficial/hydra-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = ["tray-icon", "macos-private-api"] }
serde_json = "=1.0.154"
global-hotkey = "=0.10.0"
percent-encoding = "=2.3.2"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "WKFrameInfo", "WKNavigationAction", "WKNavigationDelegate", "WKWebView"] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
tempfile = "=3.27.0"

# Linux: the overlay's input shape, clipboard and screenshots (GTK, the version Tauri uses), the pointer on X11,
# and the desktop portal on Wayland. All three are already in Cargo.lock through Tauri and its plugins.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
x11rb = "=0.14.0"
zbus = "=5.19.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
